    --or-clar:#f3dc97;
    --or:#c99a3e;
    --or-fosc:#7a5519;
    --tinta:#231709;
    --paper:#efdfb8;
    --vermell:#9e2418;
    --mida: min(80vw, 34dvh, 470px);
    --ample: min(100%, 470px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; min-height:100%; }
  html{ background:#120c07; }
  body{
    background:
      radial-gradient(ellipse 90% 60% at 50% -5%, #4a3420 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 110%, #000 0%, transparent 70%),
      linear-gradient(180deg, #22170e 0%, #120c07 100%);
    background-attachment: fixed;
    color: var(--paper);
    font-family:'Cormorant Garamond', serif;
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.35; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .app{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    height:100vh; height:100dvh; min-height: 520px;
    gap: 1.2dvh;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .columna{ display:flex; flex-direction:column; align-items:center; gap:1.2dvh; width:100%; }
  .columna.esq{ flex:0 0 auto; }
  .columna.dre{ flex:1 1 auto; min-height:0; width: min(100%, 470px); }

  .capcalera{ text-align:center; line-height:1.1; }
  .data-llarga{
    font-family:'IM Fell English', serif; font-style:italic;
    font-size: clamp(14px, 2.4dvh, 22px);
    color: var(--or-clar);
    text-shadow: 0 1px 0 #000, 0 0 14px rgba(201,154,62,.35);
  }
  .lema{
    font-family:'Cinzel', serif; font-size: 10px; letter-spacing: 4px; text-transform:uppercase;
    color: var(--or); opacity:.75; margin-top:2px;
  }

  /* ====================== RELLOTGE 3D ====================== */
  .rellotge{
    position:relative;
    width: var(--mida); aspect-ratio:1/1;
    perspective: 1800px;
    cursor:pointer;
    touch-action: manipulation;
    outline:none;
  }
  .ombra-terra{
    position:absolute; left:12%; right:12%; bottom:-5%; height:9%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.7) 0%, rgba(0,0,0,0) 70%);
    filter: blur(4px);
    transition: transform 4s ease-in-out, opacity 4s ease-in-out;
  }
  .rellotge.girant .ombra-terra{ transform: scaleX(.55); opacity:.6; }
  .gir{
    position:absolute; inset:0;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 8s cubic-bezier(.42,.0,.18,1);
  }
  .cilindre{
    position:absolute; inset:0;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    pointer-events:none; opacity:0; transition: opacity .25s;
  }
  .rellotge.girant .cilindre{ opacity:1; }
  .capa-volum{
    position:absolute; inset:0.4%; border-radius:50%;
    background-image: var(--textura-patina);
    background-size: 230% 230%;
    background-position: 50% 45%;
    background-repeat:no-repeat;
    box-shadow: inset 0 0 10px rgba(0,0,0,.75);
  }
  .cara{
    position:absolute; inset:0; border-radius:50%;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,.6));
  }
  .cara svg{ width:100%; height:100%; display:block; overflow:visible; }
  .cara.davant{ transform: translateZ(14px); }
  .cara.darrere{ transform: rotateY(180deg) translateZ(14px); }
  .pista-toc{
    position:absolute; left:0; right:0; bottom:-1.2em; text-align:center;
    font-family:'Cinzel', serif; font-size:10px; letter-spacing:3px; text-transform:uppercase;
    color: var(--or); opacity:.0; transition: opacity 1.2s; pointer-events:none;
  }
  .pista-toc.visible{ opacity:.6; }

  /* ====================== CINTA LLISCANT ====================== */
  .cinta{
    width: var(--ample);
    display:flex; gap:10px;
    overflow-x:auto; overflow-y:hidden;
    padding: 4px 6px 8px; flex:0 0 auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%);
    cursor: grab;
  }
  .cinta::-webkit-scrollbar{ display:none; }
  .placa{
    flex:0 0 auto;
    position:relative;
    display:flex; align-items:center; gap:9px;
    padding: clamp(4px,.8dvh,8px) 20px clamp(4px,.8dvh,8px) 18px;
    border-radius: 9px;
    color:#2b1c07;
    background:
      linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 40%),

  /* ====================== CALENDARI ====================== */

  .boto-llauto{
    width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;

  .cal-graella{ display:grid; height:100%; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, minmax(0,1fr)); gap: 2px 3px; }
  .cap-dia{
    text-align:center; font-family:'Cinzel', serif; font-weight:700; font-size:11px; letter-spacing:1px;
    padding: 3px 0 3px; color:#4a3010; border-bottom: 1px solid rgba(90,55,15,.35);

  /* Anella imantada */
  .iman{
    position:absolute; left:50%; top:50%; z-index:3; pointer-events:none;
    width: calc(min(100cqw, 100cqh) + 4px); height: calc(min(100cqw, 100cqh) + 4px);

  }
  .iman .anella{
    position:absolute; inset:0; border-radius:50%;
    background:
      /* picat suau del metall vell */
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.35' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .16  0 0 0 0 .06  0 0 0 0 .02  1.6 0 0 0 -.95'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>") center/100% 100%,
      conic-gradient(from -90deg,

    -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%, #000 75%, transparent 77%);
            mask: radial-gradient(circle, transparent 60%, #000 62%, #000 75%, transparent 77%);
  }
  /* rovell: només a la meitat no vermella */
  .iman .anella::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.35' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .16  0 0 0 0 .06  0 0 0 0 .02  3.2 0 0 0 -1.55'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>") center/100% 100%,
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.22' numOctaves='2' seed='19'/><feColorMatrix values='0 0 0 0 .86  0 0 0 0 .44  0 0 0 0 .12  0 3.4 0 0 -1.75'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>") center/100% 100%;
    -webkit-mask: conic-gradient(from -90deg, transparent 0deg 172deg, #000 192deg 348deg, transparent 360deg);
            mask: conic-gradient(from -90deg, transparent 0deg 172deg, #000 192deg 348deg, transparent 360deg);
  }
  /* brillantor gastada i vora corroïda */
  .iman .anella::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,225,180,.35), transparent 32%),
      radial-gradient(circle at 72% 80%, rgba(0,0,0,.35), transparent 40%);
  }
  .iman .anella.encaixa{ animation: encaixa 1.1s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes encaixa{
    0%  { transform: scale(2.4) rotate(-160deg); opacity:0; }
    55% { transform: scale(.86) rotate(12deg); opacity:1; }
    75% { transform: scale(1.07) rotate(-4deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  .iman::after{
    content:""; position:absolute; inset:12%; border-radius:50%;
    border: 1.5px solid rgba(150,60,30,.45);
    animation: camp 2.6s ease-out infinite;
  }
  @keyframes camp{ 0%{ transform:scale(1); opacity:.8; } 100%{ transform:scale(1.75); opacity:0; } }

  .cal-peu{
    position:relative; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: 3px 10px clamp(4px,1dvh,10px); flex:0 0 auto;

  .llegenda{ display:flex; gap:10px; font-family:'Cinzel', serif; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:#4a3010; }

  .ll-cs{ background: rgba(158,36,24,.22); }
  .ll-fe{ border-radius:50% !important; background: radial-gradient(circle at 38% 32%, #d8543f, #5e0f09); }
  .ll-av{ border-radius:50% !important; border:2px solid; border-color:#9a3326 #9a3326 #8a4a1c #8a4a1c; }
  .boto-avui{
    border:none; cursor:pointer; border-radius: 12px; padding: 4px 10px;
    font-family:'Cinzel', serif; font-size:10px; font-weight:700; letter-spacing:2px; color:#3a2208;
    background: linear-gradient(180deg, #f4dd99, #b8873a); box-shadow: 0 2px 3px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.6);
    opacity:0; pointer-events:none; transition: opacity .3s;
  }
  .boto-avui.visible{ opacity:1; pointer-events:auto; }

  /* Etiqueta de festa */
  .etiqueta{
    position:absolute; z-index:20; left:0; top:0;
    max-width: 78%;
    padding: 8px 14px 9px 22px;
    background: linear-gradient(180deg, #fbf3dc, #eadbb3);
    color:#2a1a07;
    border: 1px solid #9c7430;
    border-radius: 4px 10px 10px 4px;
    box-shadow: 0 8px 16px rgba(40,20,0,.45);

    transition: opacity .25s, transform .25s;
    pointer-events:none;
  }
  .etiqueta.visible{ opacity:1; transform: translateY(0) scale(1); pointer-events:auto; }
  .etiqueta::before{ /* forat de l'etiqueta */
    content:""; position:absolute; left:8px; top:50%; width:7px; height:7px; margin-top:-3.5px; border-radius:50%;
    background:#6b4712; box-shadow: inset 0 1px 1px rgba(0,0,0,.6), 0 0 0 1.5px #d9b865;
  }
  .etiqueta::after{
    content:""; position:absolute; left: var(--fletxa, 50%); bottom:-7px; width:12px; height:12px; margin-left:-6px;
    background:#eadbb3; border-right:1px solid #9c7430; border-bottom:1px solid #9c7430; transform: rotate(45deg);
  }
  .etiqueta.avall::after{ bottom:auto; top:-7px; transform: rotate(225deg); background:#fbf3dc; }
  .etiqueta b{ display:block; font-family:'IM Fell English', serif; font-weight:400; font-size:18px; color:#7d1a10; }
  .etiqueta em{ display:block; font-family:'Cinzel', serif; font-style:normal; font-size:9px; letter-spacing:1.6px; text-transform:uppercase; opacity:.7; margin-top:3px; }

  /* Botó de so */
  .boto-so{
    position:fixed; z-index:30;
    top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; padding:0;
    background: radial-gradient(circle at 35% 30%, #fbe7a8, #c1913c 55%, #6b4712);

    display:grid; place-items:center;
  }
  .boto-so svg{ width:22px; height:22px; stroke:#3a2208; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .boto-so .barra{ display:none; }
  .boto-so.mut .barra{ display:block; }

  /* ====================== DISPOSICIONS ====================== */
  @media (orientation: landscape) and (min-width: 820px){
    :root{ --mida: min(46vw, 76dvh, 640px); }

  }
  @media (orientation: landscape) and (max-height: 540px){
    :root{ --mida: min(42vw, 72dvh); }
    .app{ flex-direction:row; justify-content:center; gap: 3vw; min-height:0; }
    .columna.esq{ width:auto; }
    .columna.dre{ width: min(50vw, 420px); flex:0 1 auto; height:100%; }

  }
  @media (orientation: portrait) and (max-height: 600px){
    :root{ --mida: min(80vw, 30dvh); }
    .lema{ display:none; }
    .llegenda{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    .gir{ transition-duration: .01s; }
    .iman::after{ animation:none; }
  }

<body>

<button class="boto-so" id="botoSo" aria-label="Campanades de les hores i els quarts">

<script>
(function(){
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const C = 300;
  function el(tag, attrs, pare){
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (pare) pare.appendChild(e);
    return e;
  }
  const rad = a => a*Math.PI/180;
  const px = (r,a) => C + r*Math.sin(rad(a));
  const py = (r,a) => C - r*Math.cos(rad(a));
  function gradient(defs, tipus, id, attrs, stops){
    const g = el(tipus, Object.assign({id}, attrs||{}), defs);
    stops.forEach(([o,c,op]) => el('stop', {offset:o, 'stop-color':c, 'stop-opacity': op===undefined?1:op}, g));
    return g;
  }
  function filtreOmbra(defs, id, dx, dy, blur, op){
    const f = el('filter', {id, x:'-30%', y:'-30%', width:'160%', height:'160%'}, defs);
    el('feGaussianBlur', {in:'SourceAlpha', stdDeviation:blur, result:'b'}, f);
    el('feOffset', {in:'b', dx, dy, result:'o'}, f);
    const ct = el('feComponentTransfer', {in:'o', result:'s'}, f);
    el('feFuncA', {type:'linear', slope:op}, ct);
    const m = el('feMerge', {}, f);
    el('feMergeNode', {in:'s'}, m);
    el('feMergeNode', {in:'SourceGraphic'}, m);
    return f;
  }
  function filtreRelleu(defs, id, escala){
    const f = el('filter', {id, x:'-20%', y:'-20%', width:'140%', height:'140%'}, defs);
    el('feGaussianBlur', {in:'SourceAlpha', stdDeviation: 1.2*escala, result:'blur'}, f);
    const sp = el('feSpecularLighting', {in:'blur', surfaceScale: 3*escala, specularConstant:'1', specularExponent:'14', 'lighting-color':'#fff4d0', result:'spec'}, f);
    el('fePointLight', {x:'120', y:'40', z:'260'}, sp);
    el('feComposite', {in:'spec', in2:'SourceAlpha', operator:'in', result:'specClip'}, f);

  // ========================= TEMPS =========================
  const MESOS = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
  const DIES = ['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'];
  const deMes = m => (/^[aeiouà]/.test(MESOS[m]) ? "d'" : 'de ') + MESOS[m];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  let diaActualClau = '';
  function actualitzaBusques(){
    const ara = new Date();
    const h = ara.getHours(), m = ara.getMinutes(), s = ara.getSeconds();
    const aH = ((h%12) + m/60 + s/3600) * 30;
    const aM = (m + s/60) * 6;
    const aS = s * 6;
    [busquesA, busquesB].forEach(b=>{
      b.h.setAttribute('transform', `rotate(${aH.toFixed(3)} ${C} ${C})`);
      b.m.setAttribute('transform', `rotate(${aM.toFixed(3)} ${C} ${C})`);
      b.s.setAttribute('transform', `rotate(${aS} ${C} ${C})`);
    });
    const clau = ara.toDateString();
    if (clau !== diaActualClau){
      const canviDeDia = diaActualClau !== '';
      diaActualClau = clau;
      document.getElementById('dataLlarga').textContent =
        `${cap(DIES[ara.getDay()])}, ${ara.getDate()} ${deMes(ara.getMonth())} de ${ara.getFullYear()}`;
      if (canviDeDia && window.__calendariRefresca) window.__calendariRefresca();
    }
    comprovaCampanades(ara);
  }
  function programaTic(){
    actualitzaBusques();
    setTimeout(programaTic, 1000 - (Date.now() % 1000) + 5);
  }

  let ctxAudio = null;
  let soActiu = true;
  try { soActiu = localStorage.getItem('rellotge-so') !== '0'; } catch(e){}
  const botoSo = document.getElementById('botoSo');
  function pintaBotoSo(){
    botoSo.classList.toggle('mut', !soActiu);
    botoSo.setAttribute('aria-pressed', soActiu ? 'true' : 'false');
  }
  pintaBotoSo();
  function audio(){
    if (!ctxAudio){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctxAudio = new AC();
    }
    if (ctxAudio.state === 'suspended') ctxAudio.resume();
    return ctxAudio;
  }
  ['pointerdown','touchend','click','keydown'].forEach(ev=>
    document.addEventListener(ev, ()=>audio(), {passive:true}));
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && ctxAudio) audio(); });

  // Campana: parcials inharmònics típics d'una campana de bronze
  const PARCIALS = [[0.5,.35,1.8],[1,.55,1],[1.183,.28,.8],[1.506,.2,.6],[2,.14,.45],[2.514,.08,.3],[3.011,.05,.22]];
  function campana(freq, volum, durada, quan){
    const ctx = audio(); if (!ctx) return;
    const t0 = ctx.currentTime + (quan||0);
    const sortida = ctx.createGain();
    sortida.gain.value = volum;
    sortida.connect(ctx.destination);
    PARCIALS.forEach(([r, g, d])=>{
      const o = ctx.createOscillator(), a = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq*r;
      a.gain.setValueAtTime(0.0001, t0);
      a.gain.linearRampToValueAtTime(g, t0 + 0.006);
      a.gain.exponentialRampToValueAtTime(0.0005, t0 + durada*d);
      o.connect(a); a.connect(sortida);
      o.start(t0); o.stop(t0 + durada*d + 0.05);
    });
    // cop del batall
    const n = ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.03), ctx.sampleRate);
    const dd = n.getChannelData(0);
    for (let i=0;i<dd.length;i++) dd[i] = (Math.random()*2-1) * Math.pow(1-i/dd.length, 3);
    const src = ctx.createBufferSource(); src.buffer = n;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = freq*2.5; bp.Q.value = 2;
    const gn = ctx.createGain(); gn.gain.value = 0.25;
    src.connect(bp); bp.connect(gn); gn.connect(sortida); src.start(t0);
  }
  // Tradició catalana: els quarts es toquen a la campana petita en parelles (ding-dong),
  // i a l'hora en punt sonen els quatre quarts i, després, les hores a la campana grossa.
  const QUART_AGUT = 784, QUART_GREU = 659.3, HORA = 196;
  function tocaQuarts(n, inici){
    let t = inici||0;
    for (let i=0;i<n;i++){
      campana(QUART_AGUT, .35, 2.2, t);
      campana(QUART_GREU, .35, 2.4, t+0.55);
      t += 1.7;
    }
    return t;
  }
  function tocaHores(h, inici){
    let t = inici||0;
    for (let i=0;i<h;i++){ campana(HORA, .6, 4.5, t); t += 2.6; }
    return t;
  }
  let darrerToc = '';
  function comprovaCampanades(ara){
    if (!soActiu || !ctxAudio) return;
    const m = ara.getMinutes(), s = ara.getSeconds();
    if (s > 3 || m % 15 !== 0) return;
    const clau = ara.getHours()+':'+m;
    if (clau === darrerToc) return;
    darrerToc = clau;
    if (m === 0){
      const h12 = ara.getHours()%12 || 12;
      const t = tocaQuarts(4, 0);
      tocaHores(h12, t + 1.4);
    } else {
      tocaQuarts(m/15, 0);
    }
  }
  botoSo.addEventListener('click', (e)=>{
    e.stopPropagation();
    soActiu = !soActiu;
    try { localStorage.setItem('rellotge-so', soActiu ? '1' : '0'); } catch(err){}
    pintaBotoSo();
    if (soActiu){ audio(); tocaQuarts(1, 0.05); }
  });

  let bufferEngranatge = null;
  function carregaEngranatge(ctx){
    if (bufferEngranatge) return Promise.resolve(bufferEngranatge);
    const bin = atob(SO_ENGRANATGE_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new Promise((ok, ko)=>{
      const p = ctx.decodeAudioData(bytes.buffer, b=>{ bufferEngranatge=b; ok(b); }, ko);
      if (p && p.then) p.then(b=>{ bufferEngranatge=b; ok(b); }).catch(()=>{});
    });
  }
  function cloc(ctx, quan){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(190, quan); o.frequency.exponentialRampToValueAtTime(55, quan+0.14);
    g.gain.setValueAtTime(0.0001, quan); g.gain.linearRampToValueAtTime(.5, quan+0.008); g.gain.exponentialRampToValueAtTime(0.0008, quan+0.25);
    o.connect(g); g.connect(ctx.destination); o.start(quan); o.stop(quan+0.3);
  }
  function soEngranatge(durada){
    if (!soActiu) return;
    const ctx = audio(); if (!ctx) return;
    carregaEngranatge(ctx).then(buf=>{
      const t0 = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = Math.min(0.598, buf.duration*0.3); src.loopEnd = buf.duration;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(.4, t0+0.15);
      g.gain.setValueAtTime(.4, t0+durada-0.4);
      g.gain.linearRampToValueAtTime(0.0001, t0+durada);
      // arrencada i frenada, com la corba del gir
      src.playbackRate.setValueAtTime(0.5, t0);
      src.playbackRate.exponentialRampToValueAtTime(2.6, t0+durada*0.3);
      src.playbackRate.setValueAtTime(2.6, t0+durada*0.45);
      src.playbackRate.exponentialRampToValueAtTime(0.25, t0+durada);
      src.connect(g); g.connect(ctx.destination);
      src.start(t0, 0.598); src.stop(t0+durada+0.05);
      cloc(ctx, t0+durada-0.05);
    }).catch(()=>{});
  }

  // ========================= GIR DE L'ESFERA (8 s) =========================
  const rellotge = document.getElementById('rellotge');
  const gir = document.getElementById('gir');
  const pista = document.getElementById('pistaToc');
  const DURADA_GIR = 8;
  let angle = 0, girant = false;
  function giraEsfera(){
    if (girant) return;
    girant = true;
    pista.classList.remove('visible');
    rellotge.classList.add('girant');
    angle += 900; // dues voltes i mitja: acaba mostrant l'altra esfera
    gir.style.transform = `rotateY(${angle}deg)`;
    soEngranatge(DURADA_GIR);
  }
  gir.addEventListener('transitionend', (e)=>{
    if (e.target !== gir) return;
    girant = false;
    rellotge.classList.remove('girant');
  });
  rellotge.addEventListener('click', giraEsfera);
  rellotge.addEventListener('keydown', e=>{ if (e.key==='Enter' || e.key===' '){ e.preventDefault(); giraEsfera(); } });
  setTimeout(()=>{ if (angle===0) pista.classList.add('visible'); }, 1500);
  setTimeout(()=>pista.classList.remove('visible'), 9000);

  // ========================= CINTA LLISCANT (només a mà) =========================
  (function(){
    const cinta = document.getElementById('cinta');
    // arrossegar amb el ratolí (amb el dit ja ho fa el navegador de manera nativa)
    let arr = null;
    cinta.addEventListener('mousedown', e=>{ arr = {x:e.clientX, s:cinta.scrollLeft}; cinta.style.cursor='grabbing'; e.preventDefault(); });
    window.addEventListener('mousemove', e=>{ if (arr) cinta.scrollLeft = arr.s - (e.clientX - arr.x); });
    window.addEventListener('mouseup', ()=>{ if (arr){ arr = null; cinta.style.cursor=''; } });
    function centra(){ cinta.style.justifyContent = (cinta.scrollWidth - cinta.clientWidth > 2) ? 'flex-start' : 'center'; }
    window.addEventListener('resize', centra);
    new MutationObserver(centra).observe(cinta, {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:['hidden']});
    centra();
  })();

  // ========================= METEO I LLOC =========================
  const fmt = v => v.toFixed(1).replace('.', ',');
  function carregaAmbient(lat, lon){
    const qs = `latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}`;
    Promise.allSettled([
      fetch(`https://api.open-meteo.com/v1/forecast?${qs}&current=temperature_2m,relative_humidity_2m,apparent_temperature&hourly=precipitation_probability&forecast_hours=7&timezone=auto`).then(r=>r.json()),
      fetch(`https://api.open-meteo.com/v1/elevation?${qs}`).then(r=>r.json()),
      fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?${qs}&localityLanguage=ca`).then(r=>r.json())
    ]).then(([rM, rE, rL])=>{
      if (rM.status==='fulfilled' && rM.value && rM.value.current){
        const c = rM.value.current;
        if (c.temperature_2m != null) document.getElementById('vTemp').textContent = fmt(c.temperature_2m)+'°C';
        if (c.relative_humidity_2m != null) document.getElementById('vHum').textContent = Math.round(c.relative_humidity_2m)+'%';
        if (c.apparent_temperature != null) document.getElementById('vSens').textContent = fmt(c.apparent_temperature)+'°C';
        const pr = (rM.value.hourly && rM.value.hourly.precipitation_probability) || [];
        const max6 = pr.slice(0, 7).reduce((a,b)=> Math.max(a, b||0), 0);
        const placa = document.getElementById('placaPluja');
        placa.hidden = !(max6 > 40);
        document.getElementById('vPluja').textContent = max6+'%';
      }
      if (rE.status==='fulfilled' && rE.value && rE.value.elevation){
        document.getElementById('vAlt').textContent = Math.round(rE.value.elevation[0])+' m';
      }
      if (rL.status==='fulfilled' && rL.value){
        const d = rL.value;
        const nom = d.city || d.locality || d.principalSubdivision;
        if (nom) document.getElementById('vLloc').textContent = nom;
      }
    });
  }
  let coords = null;
  function actualitzaAmbient(){
    const perDefecte = ()=>{ if (!coords) carregaAmbient(41.3874, 2.1686); else carregaAmbient(coords.lat, coords.lon); };
    if (!('geolocation' in navigator)) return perDefecte();
    navigator.geolocation.getCurrentPosition(p=>{
      coords = {lat:p.coords.latitude, lon:p.coords.longitude};
      carregaAmbient(coords.lat, coords.lon);
    }, perDefecte, {enableHighAccuracy:false, timeout:9000, maximumAge:600000});
  }
  actualitzaAmbient();
  setInterval(actualitzaAmbient, 10*60*1000);

  // ========================= FESTIUS (Barcelona) =========================
  function pasqua(any){
    const a=any%19, b=Math.floor(any/100), c=any%100, d=Math.floor(b/4), e=b%4,
      f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
      mes=Math.floor((h+l-7*m+114)/31), dia=((h+l-7*m+114)%31)+1;
    return new Date(any, mes-1, dia);
  }
  const clauData = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const sumaDies = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
  function festiusBase(any){
    const P = pasqua(any);
    const f = (m,d,nom,ambit) => [clauData(new Date(any,m-1,d)), {nom, ambit}];
    return new Map([
      f(1,1,"Cap d'Any",'Estatal'),
      f(1,6,'Reis','Estatal'),
      [clauData(sumaDies(P,-2)), {nom:'Divendres Sant', ambit:'Estatal'}],
      [clauData(sumaDies(P,1)),  {nom:'Dilluns de Pasqua Florida', ambit:'Catalunya'}],
      f(5,1,'Festa del Treball','Estatal'),
      [clauData(sumaDies(P,50)), {nom:'Dilluns de Pasqua Granada', ambit:'Festa local de Barcelona'}],
      f(6,24,'Sant Joan','Catalunya'),
      f(8,15,"L'Assumpció",'Estatal'),
      f(9,11,'Diada Nacional de Catalunya','Catalunya'),
      f(9,24,'La Mercè','Festa local de Barcelona'),
      f(10,12,"Festa Nacional d'Espanya",'Estatal'),
      f(11,1,'Tots Sants','Estatal'),
      f(12,6,'Dia de la Constitució','Estatal'),
      f(12,8,'La Immaculada','Estatal'),
      f(12,25,'Nadal','Estatal'),
      f(12,26,'Sant Esteve','Catalunya')
    ]);
  }
  const festiusAPI = {}; // any -> Map (dades oficials de Catalunya consultades en línia)
  function festiusAny(any){
    const base = festiusBase(any);
    const api = festiusAPI[any];
    if (!api) return base;
    const res = new Map();
    api.forEach((v,k)=>{ res.set(k, base.has(k) ? base.get(k) : v); });
    base.forEach((v,k)=>{ if (v.ambit.startsWith('Festa local')) res.set(k, v); });
    return res;
  }
  function festiu(d){ return festiusAny(d.getFullYear()).get(clauData(d)) || null; }
  let darreraConsulta = 0;
  function consultaFestius(){
    darreraConsulta = Date.now();
    const avui = new Date();
    const anys = new Set();
    for (let k=-4;k<=4;k++) anys.add(new Date(avui.getFullYear(), avui.getMonth()+k, 1).getFullYear());
    anys.forEach(any=>{
      fetch(`https://date.nager.at/api/v3/PublicHolidays/${any}/ES`)
        .then(r=> r.ok ? r.json() : Promise.reject(r.status))
        .then(llista=>{
          const m = new Map();
          llista.forEach(h=>{
            if (!h.counties || h.counties.includes('ES-CT')){
              m.set(h.date, {nom:h.localName || h.name, ambit: h.counties ? 'Catalunya' : 'Estatal'});
            }
          });
          if (m.size){ festiusAPI[any] = m; if (window.__calendariRefresca) window.__calendariRefresca(true); }
        })
        .catch(()=>{ /* sense connexió: es mantenen els festius calculats */ });
    });
  }
  consultaFestius();
  setInterval(consultaFestius, 6*60*60*1000);
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState==='visible' && Date.now()-darreraConsulta > 6*60*60*1000) consultaFestius();
  });

  // ========================= CALENDARI =========================
  (function(){
    const RANG = 4;
    const pistaEl = document.getElementById('calPista');
    const finestra = document.getElementById('calFinestra');
    const titol = document.getElementById('calTitol');
    const punts = document.getElementById('calPunts');
    const bAnt = document.getElementById('calAnt'), bSeg = document.getElementById('calSeg');
    const bAvui = document.getElementById('botoAvui');
    const etiqueta = document.getElementById('etiqueta');
    const paper = document.getElementById('calPaper');
    let idx = RANG, amplada = 0, mesos = [], iman = null, cellaAvui = null;

    function construeix(){
      const avui = new Date();
      pistaEl.innerHTML = ''; punts.innerHTML = ''; mesos = [];
      for (let k=-RANG;k<=RANG;k++){
        const d0 = new Date(avui.getFullYear(), avui.getMonth()+k, 1);
        mesos.push(d0);
        const panell = document.createElement('div');
        panell.className = 'cal-mes';
        const g = document.createElement('div');
        g.className = 'cal-graella';
        ['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].forEach((n,i)=>{
          const c = document.createElement('div');
          c.className = 'cap-dia' + (i>=5 ? ' cs' : '');
          c.textContent = n; g.appendChild(c);
        });
        const offset = (d0.getDay()+6)%7;
        for (let i=0;i<offset;i++){ const b=document.createElement('div'); b.className='dia buit'; g.appendChild(b); }
        const dies = new Date(d0.getFullYear(), d0.getMonth()+1, 0).getDate();
        for (let dd=1; dd<=dies; dd++){
          const data = new Date(d0.getFullYear(), d0.getMonth(), dd);
          const c = document.createElement('div');
          const ds = data.getDay();
          let cls = 'dia';
          if (ds===0 || ds===6) cls += ' cs';
          const fe = festiu(data);
          if (fe){ cls += ' festiu'; c.dataset.festa = fe.nom; c.dataset.ambit = fe.ambit; }
          const esAvui = data.toDateString() === avui.toDateString();
          c.className = cls;
          c.dataset.data = clauData(data);
          c.innerHTML = `<span class="num">${dd}</span>`;
          if (fe) c.setAttribute('aria-label', `${dd}: ${fe.nom}`);
          if (esAvui){
            cellaAvui = c;
            iman = document.createElement('div');
            iman.className = 'iman';
            iman.innerHTML = '<div class="anella"></div>';
            c.appendChild(iman);
          }
          g.appendChild(c);
        }
        panell.appendChild(g);
        pistaEl.appendChild(panell);
        const p = document.createElement('span');
        p.className = 'punt' + (k===0 ? ' centre' : '');
        punts.appendChild(p);
      }
      mesura();
      situa(false);
    }
    function mesura(){ amplada = finestra.clientWidth; }
    function situa(anim){
      pistaEl.style.transition = anim ? 'transform .45s cubic-bezier(.25,.9,.3,1)' : 'none';
      pistaEl.style.transform = `translate3d(${-idx*amplada}px,0,0)`;
      const d = mesos[idx];
      titol.innerHTML = `${cap(MESOS[d.getMonth()])}<small>${d.getFullYear()}</small>`;
      [...punts.children].forEach((p,i)=>p.classList.toggle('actiu', i===idx));
      bAnt.disabled = idx===0; bSeg.disabled = idx===mesos.length-1;
      bAvui.classList.toggle('visible', idx!==RANG);
      amagaEtiqueta();
    }
    let idxPrevi = RANG;
    function vesA(i){
      i = Math.max(0, Math.min(mesos.length-1, i));
      const tornaAvui = (i===RANG && idxPrevi!==RANG);
      idx = i; idxPrevi = i;
      situa(true);
      if (tornaAvui) encaixa(350);
    }
    function encaixa(retard){
      if (!iman) return;
      const a = iman.querySelector('.anella');
      a.classList.remove('encaixa');
      setTimeout(()=>{ void a.offsetWidth; a.classList.add('encaixa'); }, retard||0);
    }
    bAnt.addEventListener('click', ()=>vesA(idx-1));
    bSeg.addEventListener('click', ()=>vesA(idx+1));
    bAvui.addEventListener('click', ()=>vesA(RANG));

    // Arrossegar amb el dit o el ratolí
    let ini = null, arrossegant = false, suprimeixClic = false;
    finestra.addEventListener('pointerdown', e=>{
      if (e.pointerType==='mouse' && e.button!==0) return;
      ini = {x:e.clientX, y:e.clientY, t:performance.now(), id:e.pointerId};
      arrossegant = false; suprimeixClic = false;
    });
    finestra.addEventListener('pointermove', e=>{
      if (!ini || e.pointerId!==ini.id) return;
      const dx = e.clientX - ini.x, dy = e.clientY - ini.y;
      if (!arrossegant){
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){
          arrossegant = true; suprimeixClic = true;
          try{ finestra.setPointerCapture(e.pointerId); }catch(err){}
          finestra.classList.add('arrossega');
          pistaEl.style.transition = 'none';
          amagaEtiqueta();
        } else if (Math.abs(dy) > 10){ ini = null; return; }
      }
      if (arrossegant){
        let desp = dx;
        if ((idx===0 && dx>0) || (idx===mesos.length-1 && dx<0)) desp = dx*0.3; // resistència als extrems
        pistaEl.style.transform = `translate3d(${-idx*amplada + desp}px,0,0)`;
      }
    });
    function acaba(e){
      if (!ini) return;
      if (arrossegant){
        const dx = e.clientX - ini.x;
        const v = dx / Math.max(1, performance.now()-ini.t);
        let nou = idx;
        if (dx < -amplada*0.22 || v < -0.45) nou = idx+1;
        else if (dx > amplada*0.22 || v > 0.45) nou = idx-1;
        finestra.classList.remove('arrossega');
        vesA(nou);
      }
      ini = null; arrossegant = false;
    }
    finestra.addEventListener('pointerup', acaba);
    finestra.addEventListener('pointercancel', e=>{ if (ini){ finestra.classList.remove('arrossega'); situa(true); } ini=null; arrossegant=false; });
    // roda / trackpad horitzontal
    let rodaAcum = 0, rodaBloq = 0;
    finestra.addEventListener('wheel', e=>{
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
      e.preventDefault();
      if (performance.now() < rodaBloq) return;
      rodaAcum += e.deltaX;
      if (Math.abs(rodaAcum) > 60){ vesA(idx + (rodaAcum>0?1:-1)); rodaAcum = 0; rodaBloq = performance.now()+500; }
    }, {passive:false});

    // Etiqueta de la festa
    let tempsEtiqueta = null;
    function amagaEtiqueta(){ etiqueta.classList.remove('visible'); clearTimeout(tempsEtiqueta); }
    finestra.addEventListener('click', e=>{
      if (suprimeixClic){ suprimeixClic = false; return; }
      const c = e.target.closest('.dia');
      if (!c || c.classList.contains('buit')) return;
      if (!c.dataset.festa){ amagaEtiqueta(); return; }
      const [a,m,d] = c.dataset.data.split('-').map(Number);
      const data = new Date(a, m-1, d);
      etiqueta.innerHTML = `<b>${c.dataset.festa}</b>${cap(DIES[data.getDay()])}, ${d} ${deMes(m-1)}<em>${c.dataset.ambit}</em>`;
      etiqueta.classList.remove('avall');
      etiqueta.classList.add('visible');
      const rp = paper.getBoundingClientRect(), rc = c.getBoundingClientRect();
      const ew = etiqueta.offsetWidth, eh = etiqueta.offsetHeight;
      let x = rc.left - rp.left + rc.width/2 - ew/2;
      x = Math.max(8, Math.min(rp.width - ew - 8, x));
      let y = rc.top - rp.top - eh - 10;
      if (y < 4){ y = rc.bottom - rp.top + 10; etiqueta.classList.add('avall'); }
      etiqueta.style.left = x+'px'; etiqueta.style.top = y+'px';
      etiqueta.style.setProperty('--fletxa', (rc.left - rp.left + rc.width/2 - x)+'px');
      clearTimeout(tempsEtiqueta);
      tempsEtiqueta = setTimeout(amagaEtiqueta, 4500);
    });
    document.addEventListener('pointerdown', e=>{ if (!paper.contains(e.target)) amagaEtiqueta(); });

    // Anella imantada: s'estira cap al dit o el punter quan s'hi acosta
    paper.addEventListener('pointermove', e=>{
      if (!iman || !cellaAvui || idx!==RANG || arrossegant) return;
      const r = cellaAvui.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
      const dist = Math.hypot(dx, dy);
      const abast = r.width*2.6;
      if (dist < abast && dist > 0){
        const f = (1 - dist/abast) * Math.min(7, dist*0.35);
        iman.style.setProperty('--mx', (dx/dist*f).toFixed(2)+'px');
        iman.style.setProperty('--my', (dy/dist*f).toFixed(2)+'px');
      } else {
        iman.style.setProperty('--mx','0px'); iman.style.setProperty('--my','0px');
      }
    });
    paper.addEventListener('pointerleave', ()=>{ if (iman){ iman.style.setProperty('--mx','0px'); iman.style.setProperty('--my','0px'); } });

    window.addEventListener('resize', ()=>{ mesura(); situa(false); });
    window.__calendariRefresca = function(nomesFestius){
      const guarda = idx;
      construeix();
      idx = nomesFestius ? guarda : RANG; idxPrevi = idx;
      situa(false);
      if (!nomesFestius) encaixa(500);
    };
    construeix();
    encaixa(700);
  })();

  programaTic();
})();
</script>
</body>
</html>
